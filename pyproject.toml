[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-gpt-mini"
version = "0.1.0"
description = "Minimal terminal chat for OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai==3.29.0",
  "python-dotenv==1.2.4",
]

[project.scripts]
terminal-gpt = "terminal_gpt_mini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

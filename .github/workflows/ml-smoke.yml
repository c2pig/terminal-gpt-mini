name: ML smoke

on:
  pull_request:
    paths:
      - "ml/**"
      - "serve/**"
      - ".github/workflows/ml-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements-ml.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r ml/requirements-ml.txt

      - name: Smoke train
        run: python ml/train.py --smoke --max-steps 10 --output-dir ml/outputs/smoke

      - name: Eval
        run: python ml/eval.py --model-dir ml/outputs/smoke

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval
          path: |
            ml/outputs/smoke/eval_results.json
            ml/outputs/smoke/sample_generations.txt
